<!DOCTYPE html>
<html>
<head>
<style>
/* 1. DEFINIR la secuencia de animación */
@keyframes latido {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.2); }
  100% { transform: scale(1); }
}

.corazon {
  font-size: 50px;
  color: red;
  
  /* 2. APLICAR la animación */
  animation: latido 1s infinite ease-in-out;
  
  /* Equivalente a: */
  /* animation-name: latido;
     animation-duration: 1s;
     animation-iteration-count: infinite;
     animation-timing-function: ease-in-out; */
}
</style>
</head>
<body>
<div class="corazon">❤️</div>
</body>
</html>
