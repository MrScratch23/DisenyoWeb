<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplos de Audio y Video</title>
    <link rel="stylesheet" href="estilos-audio-video.css">
</head>
<body>
    <h1>Ejemplos de Audio y Video</h1>
    
    <!-- Audio básico -->
    <h2>Reproductor de Audio</h2>
    <audio controls class="reproductor-audio">
        <source src="audio/musica.mp3" type="audio/mpeg">
        <source src="audio/musica.ogg" type="audio/ogg">
        Tu navegador no soporta el elemento de audio.
    </audio>
    
    <!-- Audio con estilos personalizados -->
    <h2>Audio con controles personalizados</h2>
    <div class="contenedor-audio">
        <audio id="audioPersonalizado" preload="metadata">
            <source src="audio/efecto.mp3" type="audio/mpeg">
        </audio>
        <div class="controles-audio">
            <button onclick="playAudio()" class="btn-audio">▶️ Reproducir</button>
            <button onclick="pauseAudio()" class="btn-audio">⏸️ Pausar</button>
            <button onclick="stopAudio()" class="btn-audio">⏹️ Detener</button>
            <input type="range" id="volumen" min="0" max="1" step="0.1" value="0.5" 
                   onchange="cambiarVolumen()" class="slider-volumen">
        </div>
    </div>
    
    <!-- Video básico -->
    <h2>Reproductor de Video</h2>
    <video controls class="reproductor-video" poster="video/poster.jpg">
        <source src="video/trailer.mp4" type="video/mp4">
        <source src="video/trailer.webm" type="video/webm">
        Tu navegador no soporta el elemento de video.
    </video>
    
    <!-- Video con subtítulos -->
    <h2>Video con subtítulos</h2>
    <video controls class="reproductor-video-subtitulos" poster="video/poster2.jpg">
        <source src="video/documental.mp4" type="video/mp4">
        <track src="subtitles/es.vtt" kind="subtitles" srclang="es" label="Español" default>
        <track src="subtitles/en.vtt" kind="subtitles" srclang="en" label="English">
    </video>
    
    <!-- Video con controles personalizados -->
    <h2>Video con controles personalizados</h2>
    <div class="contenedor-video">
        <video id="videoPersonalizado" class="video-estilizado" poster="video/poster3.jpg">
            <source src="video/presentacion.mp4" type="video/mp4">
        </video>
        <div class="controles-video">
            <button onclick="playVideo()" class="btn-video">▶️</button>
            <button onclick="pauseVideo()" class="btn-video">⏸️</button>
            <button onclick="toggleMute()" class="btn-video">🔊</button>
            <input type="range" id="progresoVideo" min="0" max="100" value="0" 
                   onchange="cambiarProgreso()" class="slider-progreso">
            <span id="tiempoVideo" class="tiempo-video">00:00 / 00:00</span>
        </div>
    </div>
    
    <script src="scripts.js"></script>
</body>
</html>
