<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Favicon y Logos</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <!-- Font Awesome (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="estilos-iconos.css">
</head>
<body>
    <h1>Ejemplos de Favicon, Logos e Iconos</h1>
    
    <!-- Logo -->
    <h2>Logo de la empresa</h2>
    <img src="logo.svg" alt="Logo de la empresa" class="logo logo-vectorial">
    
    <!-- Iconos de Font Awesome como fuentes -->
    <h2>Iconos de Font Awesome (como fuentes)</h2>
    <div class="iconos-container">
        <i class="fas fa-home icono icono-pequeno"></i>
        <i class="fas fa-envelope icono"></i>
        <i class="fas fa-heart icono icono-grande icono-animado"></i>
        <i class="fas fa-search icono"></i>
    </div>
    
    <!-- Iconos como SVG -->
    <h2>Iconos SVG</h2>
    <div class="iconos-svg-container">
        <svg class="icono-svg" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        <svg class="icono-svg" viewBox="0 0 24 24">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
    </div>
</body>
</html>
