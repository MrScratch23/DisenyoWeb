<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Imágenes</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>Ejemplos de Imágenes</h1>
    
    <!-- Imagen básica -->
    <h2>Imagen básica</h2>
    <img src="paisaje.jpg" alt="Paisaje natural" width="400" height="300">
    
    <!-- Imagen con filtros -->
    <h2>Imagen con filtros</h2>
    <img src="retrato.jpg" alt="Retrato" class="imagen-filtro" width="400">
    
    <!-- Imagen con opacidad -->
    <h2>Imagen con opacidad</h2>
    <img src="ciudad.jpg" alt="Ciudad" class="imagen-opaca" width="400">
    
    <!-- Imagen con object-fit -->
    <h2>Imagen con object-fit</h2>
    <div class="contenedor-imagen">
        <img src="montaña.jpg" alt="Montaña" class="imagen-ajustada">
    </div>
</body>
</html>
